{% extends 'base.html' %}

{% block title %}Producción — OperaStock{% endblock %}

{% block extra_css %}
<style>
    .prod-header {
        background: linear-gradient(135deg, #0f3460 0%, #533483 100%);
        border-radius: 1rem;
        padding: 2rem;
        color: #fff;
        margin-bottom: 2rem;
    }
    .prod-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: .25rem; }
    .form-card { border-radius: 1rem; overflow: hidden; box-shadow: var(--os-card-shadow); border: none; }
    .form-card .card-body { padding: 2rem; }
    .form-label { font-weight: 600; color: #444; }
    .hint-box {
        background: rgba(116,185,255,.08);
        border: 1px solid rgba(116,185,255,.25);
        border-radius: .6rem;
        padding: 1rem;
        font-size: .88rem;
        color: #555;
    }
    .hint-box i { color: var(--os-info); }
    .step-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px; height: 28px;
        background: var(--os-primary);
        color: #fff;
        border-radius: 50%;
        font-weight: 700;
        font-size: .8rem;
        flex-shrink: 0;
    }
    .step-item { display: flex; align-items: flex-start; gap: .75rem; margin-bottom: .6rem; }
    .step-text { font-size: .88rem; color: #555; padding-top: .2rem; }
</style>
{% endblock %}

{% block content %}
<div class="page-heading"><div><span class="eyebrow">OPERACIONES</span><h1>Producción</h1></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" href="{% url 'produccion:formula_list' %}">Fórmulas</a><a class="btn btn-primary" href="{% url 'produccion:produccion_list' %}">Ver producciones</a></div></div>
<div class="card card-os p-4" style="max-width:760px"><h2 class="h5 mb-4">Registrar producción</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Previsualizar producción</button></form></div>
{% endblock %}
