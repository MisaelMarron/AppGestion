{% extends 'base.html' %}

{% block title %}Confirmar eliminación — OperaStock{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-os text-center p-4">
            <div class="text-danger mb-3" style="font-size:3.5rem">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h3 class="fw-bold mb-2">¿Eliminar {{ tipo }}?</h3>
            <p class="text-muted mb-4">
                Estás a punto de eliminar <strong>«{{ objeto }}»</strong>.
                Esta acción no se puede deshacer.
            </p>
            <form method="post" class="d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i>Cancelar
                </a>
                <button type="submit" class="btn btn-danger px-4">
                    <i class="bi bi-trash me-1"></i>Sí, eliminar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
